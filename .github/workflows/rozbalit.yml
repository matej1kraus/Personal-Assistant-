name: Rozbalit aplikaci
on:
  push:
    paths:
      - 'asistent-aplikace.zip'
      - '.github/workflows/rozbalit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rozbalit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozbalit zip do kořene repozitáře
        run: |
          unzip -o asistent-aplikace.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rozbalení aplikace ze zipu" || echo "Nic nového"
          git push
